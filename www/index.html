<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 640, H = 720, DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;

// ---------- audio ----------
let ac = null;
let muted = (() => { try { return localStorage.getItem('tbj_muted') === '1'; } catch (e) { return false; } })();
function toggleMute() { muted = !muted; try { localStorage.setItem('tbj_muted', muted ? '1' : '0'); } catch (e) {} }
function beep(f, d = .08, type = 'square', vol = .05, slide = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, ac.currentTime + d);
    g.gain.value = vol; g.gain.linearRampToValueAtTime(0, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
// a single filtered noise hit -- the building block for the drum sting below
function drumHit(t0, dur, freq, vol, q = 1.1) {
  const n = Math.max(1, ac.sampleRate * dur | 0), buf = ac.createBuffer(1, n, ac.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  const g = ac.createGain(); g.gain.value = vol; g.gain.linearRampToValueAtTime(0, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(t0); src.stop(t0 + dur);
}
// heist-briefing drum sting: tense low toms + a hi-hat run, in the spirit of a spy-movie
// cue -- an original rhythm, not the copyrighted Mission: Impossible theme melody.
function heistSting() {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    [0, .14, .28, .50, .64, .78].forEach((o, i) => drumHit(t + o, .12, i % 3 === 0 ? 105 : 150, .1));
    [0, .07, .14, .21, .28, .35, .50, .57, .64, .71, .78, .85].forEach(o => drumHit(t + o, .035, 5200, .028, 3));
  } catch (e) {}
}

// ---------- level geometry ----------
// each platform is a sloped girder; barrels roll downhill (yr > yl = roll right)
// levels 1-5 use this exact hand-built layout; level 6+ generates a fresh one per
// level with genLayout() below (same vertical rhythm, but the platform widths,
// ladder positions and coin spots all vary), so the climb itself is never memorized.
const FIXED_PLATS = [
  { x1: 0,  x2: 640, yl: 690, yr: 680 },   // ground, rolls left
  { x1: 0,  x2: 580, yl: 580, yr: 600 },   // rolls right
  { x1: 60, x2: 640, yl: 500, yr: 480 },   // rolls left
  { x1: 0,  x2: 580, yl: 370, yr: 390 },   // rolls right
  { x1: 60, x2: 640, yl: 290, yr: 270 },   // rolls left
  { x1: 0,  x2: 400, yl: 150, yr: 160 },   // top: government lives here
];
const surf = (p, x) => p.yl + (p.yr - p.yl) * (x - p.x1) / (p.x2 - p.x1);
const inP = (p, x) => x >= p.x1 && x <= p.x2;

const FIXED_LADDER_DEFS = [[0, 1, 120], [1, 2, 520], [2, 3, 140], [3, 4, 500], [4, 5, 300]];
const FIXED_LADDERS = FIXED_LADDER_DEFS.map(([lo, hi, x]) => ({ x, top: surf(FIXED_PLATS[hi], x), bot: surf(FIXED_PLATS[lo], x) }));

const FIXED_COIN_SPOTS = [
  [0, 220], [0, 340], [0, 460], [1, 90], [1, 300], [1, 440], [2, 200], [2, 340], [2, 470],
  [3, 110], [3, 250], [3, 400], [4, 200], [4, 400], [4, 560], [5, 200],
];
const FIXED_GOV = { x: 12, w: 96 };
const FIXED_EXIT = { x: 340, w: 60 };
const FIXED_KEYS = [[596, 2], [60, 3], [560, 4]]; // [x, platform] for the 3-key boss levels

// the Y rhythm (platform heights) never changes -- gravity/jump tuning, the boss's
// platform, drone heights etc. all assume it. Only x-spans, slopes, ladder x and
// coin x vary per generated level.
const LAYOUT_Y = [690, 580, 500, 370, 290, 150];
function genLayout(seedN) {
  let sd = seedN * 104729 + 7793; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const plats = [{ x1: 0, x2: 640, yl: LAYOUT_Y[0], yr: LAYOUT_Y[0] - 10 }];
  for (let i = 1; i <= 5; i++) {
    const top = i === 5, openLeft = i % 2 === 0, gap = 40 + r() * 80;
    let x1 = openLeft ? gap : 0, x2 = openLeft ? 640 : 640 - gap;
    if (top) { x1 = 0; x2 = 340 + r() * 90; } // always leaves room for the government building + portal
    const slope = 12 + r() * 14;
    plats.push({ x1, x2, yl: i % 2 === 0 ? LAYOUT_Y[i] : LAYOUT_Y[i] - slope, yr: i % 2 === 0 ? LAYOUT_Y[i] - slope : LAYOUT_Y[i] });
  }
  const ladders = [];
  for (let i = 0; i < 5; i++) {
    const lo = plats[i], hi = plats[i + 1], x0 = Math.max(lo.x1, hi.x1) + 30, x1e = Math.min(lo.x2, hi.x2) - 30;
    const x = x1e > x0 ? x0 + r() * (x1e - x0) : (Math.max(lo.x1, hi.x1) + Math.min(lo.x2, hi.x2)) / 2;
    ladders.push({ x, top: surf(hi, x), bot: surf(lo, x) });
  }
  const GOV = { x: 12, w: 96 }, top5 = plats[5];
  const exitMin = GOV.x + GOV.w + 60, exitMax = top5.x2 - 70;
  const EXIT = { x: exitMax > exitMin ? exitMin + r() * (exitMax - exitMin) : exitMin, w: 60 };
  const coinSpots = [];
  for (let i = 0; i <= 5; i++) {
    const p = plats[i], n = (i === 0 || i === 5) ? 2 : 3, span = Math.max(60, p.x2 - p.x1 - 80);
    for (let j = 0; j < n; j++) coinSpots.push([i, p.x1 + 40 + r() * span]);
  }
  // key spots: near an edge of platforms 2/3/4, clamped to whatever width this level's platforms got
  const edge = (p, right) => right ? Math.max(p.x1 + 30, p.x2 - 40) : Math.min(p.x2 - 30, p.x1 + 40);
  const keys = [[edge(plats[2], true), 2], [edge(plats[3], false), 3], [edge(plats[4], true), 4]];
  return { plats, ladders, GOV, EXIT, coinSpots, keys };
}

let plats = FIXED_PLATS, ladders = FIXED_LADDERS, GOV = FIXED_GOV, EXIT = FIXED_EXIT;
const CRYPTO = [ // collectible coins
  { s: 'B', c: '#f7931a', r: '#ffd27a' },   // Bitcoin
  { s: '\u039E', c: '#5c6fd6', r: '#b4c0ff' }, // Ethereum
  { s: 'S', c: '#8a4df0', r: '#d0b0ff' },   // Solana
  { s: 'D', c: '#c9a227', r: '#ffe58a' },   // Dogecoin
];
const FACTS = [ // crypto trivia shown on the level-clear screen
  "Bitcoin's creator, Satoshi Nakamoto, has never been publicly identified.",
  "The Bitcoin genesis block hid a message in its code: a 2009 headline about a bank bailout.",
  'Only 21 million bitcoins will ever exist -- the last is expected to be mined around the year 2140.',
  'In 2010, someone paid 10,000 BTC for two pizzas -- the first known commercial Bitcoin purchase.',
  'Ethereum introduced smart contracts: code that runs automatically, with no middleman.',
  "Ethereum's 2022 switch to proof-of-stake cut its energy use by more than 99%.",
  "Dogecoin started in 2013 as a joke based on the 'Doge' meme, with no fixed supply cap.",
  "Solana can process thousands of transactions per second -- far more than Bitcoin's roughly 7.",
  'A new Bitcoin block is mined roughly every 10 minutes, on average, by design.',
  "Bitcoin's issuance is cut in half about every four years -- an event called 'the halving'.",
  'A blockchain is a chain of blocks, each cryptographically linked to the one before it.',
  "Lose your private key and you lose your crypto -- there's no password reset.",
  'Self-custody means holding your own keys instead of trusting an exchange to hold them.',
  "The 2014 collapse of the Mt. Gox exchange lost roughly 850,000 bitcoins.",
  "'HODL' began life as a 2013 forum typo for 'hold' and became crypto slang for holding on.",
  'El Salvador became the first country to adopt Bitcoin as legal tender, in 2021.',
  "A crypto wallet doesn't store coins -- it stores the keys that prove you own them.",
  "Ethereum's Vitalik Buterin proposed it in a white paper in 2013, at age 19.",
  "A confirmed Bitcoin transaction is irreversible -- there's no chargeback.",
  'Stablecoins are cryptocurrencies designed to hold a steady value, often pegged to a fiat currency.',
  "Bitcoin's core protocol has never been successfully hacked since it launched in 2009.",
  'Mining is the process of using computing power to validate transactions and add new blocks.',
  'A blockchain fork happens when its community disagrees on the rules and the chain splits in two.',
  'Cold storage means keeping crypto keys on a device that has never touched the internet.',
  "Satoshi Nakamoto's own holdings, untouched since 2010, are widely estimated at over 1 million BTC.",
];
const FIAT = [ // rolling hazards
  { l: 'USD', s: '$', c: '#2e9e50', r: '#8ff0a4' },
  { l: 'EUR', s: '\u20AC', c: '#2f6fd6', r: '#9cc4ff' },
  { l: 'ZAR', s: 'R', c: '#e08a12', r: '#ffd27a' },
];
const LEVELS = [
  { name: 'LOCAL REGULATOR', tip: 'Fiat rolls downhill. Jump it!', pc: ['#1f8f6b', '#34d399', '#0d5a44'], bg: ['#0d1430', '#070a14'] },
  { name: 'CENTRAL BANK', tip: 'NEW: Inflation fireballs bounce!', fire: true, pc: ['#a8801a', '#f2c94c', '#6b4f0d'], bg: ['#241a0a', '#0f0a04'] },
  { name: 'TAX AGENCY', tip: 'NEW: IRS audit drones fly in. Watch the !', fire: true, drones: true, pc: ['#7a4fc4', '#b794f6', '#43267a'], bg: ['#1a1030', '#0a0714'] },
  { name: 'EXCHANGE BAN', tip: 'NEW: Frozen accounts - the floor is slippery!', fire: true, drones: true, ice: true, pc: ['#3b82c4', '#8fd0ff', '#1e4a7a'], bg: ['#0a1c30', '#050b14'] },
  { name: 'GLOBAL SUMMIT', tip: 'BOSS: Fiat trains! Grab all 3 KEYS to unseal FREEDOM.', fire: true, drones: true, ice: true, boss: true, lock: true, pc: ['#a83a3a', '#ff7b7b', '#5c1a1a'], bg: ['#2a0a12', '#10040a'] },
];
let cfg = LEVELS[0];
// ---------- shop (cosmetic only -- never affects difficulty or scoring) ----------
const SHOP = [
  { id: 'robot_classic', cat: 'robot', name: 'Classic', price: 0, skin: { body: ['#dbe6f2', '#8ea5c0'], head: ['#f0f5fb', '#a9bbd0'], badge: '#f7931a', visor: '#39f5ff', limb: '#71839e', joint: '#2f3b4f' } },
  { id: 'robot_stealth', cat: 'robot', name: 'Stealth', price: 250, skin: { body: ['#3a4655', '#181d24'], head: ['#4a5665', '#1c2129'], badge: '#ff5252', visor: '#ff5252', limb: '#232a34', joint: '#0c0f13' } },
  { id: 'robot_gold', cat: 'robot', name: 'Gold Heist', price: 600, skin: { body: ['#ffe9a8', '#d4a017'], head: ['#fff3cf', '#e0b23c'], badge: '#7dffb0', visor: '#1a1200', limb: '#b9860b', joint: '#7a5900' } },
  { id: 'robot_neon', cat: 'robot', name: 'Neon', price: 900, skin: { body: ['#ffb3ff', '#7a3cff'], head: ['#c2fbff', '#3cc9ff'], badge: '#39f5ff', visor: '#ff2ee6', limb: '#7a3cff', joint: '#3d1e80' } },
  { id: 'trail_none', cat: 'trail', name: 'None', price: 0 },
  { id: 'trail_spark', cat: 'trail', name: 'Spark', price: 300, color: '#ffd34d' },
  { id: 'trail_frost', cat: 'trail', name: 'Frost', price: 300, color: '#9be7ff' },
  { id: 'boulder_stone', cat: 'boulder', name: 'Stone', price: 0, rock: ['#9aa4b2', '#5c6672', '#2e3540'] },
  { id: 'boulder_molten', cat: 'boulder', name: 'Molten', price: 400, rock: ['#ff8a3c', '#c23d0e', '#5c1400'] },
  { id: 'boulder_glacier', cat: 'boulder', name: 'Glacier', price: 400, rock: ['#cdeeff', '#7fc3e6', '#3d6f8a'] },
  { id: 'coin_classic', cat: 'coin', name: 'Classic', price: 0 },
  { id: 'coin_neon', cat: 'coin', name: 'Neon', price: 300 },
];
const SHOP_CATS = ['robot', 'trail', 'boulder', 'coin'];
const SHOP_LABELS = { robot: 'ROBOT SKIN', trail: 'TRAIL EFFECT', boulder: 'BOULDER SKIN', coin: 'COIN SKIN' };
const SHOP_ROWY = { robot: 350, trail: 430, boulder: 510, coin: 590 };
let coinBank = +(localStorage.getItem('tbj_bank') || 0);
let botName = (() => { try { return localStorage.getItem('tbj_name') || 'UNIT-7'; } catch (e) { return 'UNIT-7'; } })();
function renameBot() {
  let n; try { n = prompt('Name your bot (max 12 characters):', botName); } catch (e) { return; }
  if (n === null || n === undefined) return;
  botName = n.trim().slice(0, 12).toUpperCase() || 'UNIT-7';
  try { localStorage.setItem('tbj_name', botName); } catch (e) {}
}
let owned = new Set(JSON.parse(localStorage.getItem('tbj_owned') || '[]'));
let equipped = Object.assign({ robot: 'robot_classic', trail: 'trail_none', boulder: 'boulder_stone', coin: 'coin_classic' }, JSON.parse(localStorage.getItem('tbj_equipped') || '{}'));
const shopItem = id => SHOP.find(i => i.id === id);
const isOwned = it => it.price === 0 || owned.has(it.id);
function shopLayout() {
  const out = [];
  for (const cat of SHOP_CATS) {
    const items = SHOP.filter(i => i.cat === cat), y = SHOP_ROWY[cat], n = items.length;
    items.forEach((it, i) => out.push({ it, x: W / 2 + (i - (n - 1) / 2) * 84, y, r: 24 }));
  }
  return out;
}
function shopTap(id) {
  const it = shopItem(id); if (!it) return;
  if (!isOwned(it)) {
    if (coinBank < it.price) { beep(140, .12, 'sawtooth', .05, -60); return; }
    coinBank -= it.price; owned.add(it.id);
    try { localStorage.setItem('tbj_bank', coinBank); localStorage.setItem('tbj_owned', JSON.stringify([...owned])); } catch (e) {}
    beep(660, .1); setTimeout(() => beep(880, .12), 90);
  } else beep(520, .08, 'triangle', .05);
  equipped[it.cat] = it.id;
  try { localStorage.setItem('tbj_equipped', JSON.stringify(equipped)); } catch (e) {}
}
const N1 = ['SEC', 'IMF', 'FED', 'ECB', 'OFAC', 'FATF', 'BIS', 'CFTC', 'MICA', 'FinCEN'];
const N2 = ['CRACKDOWN', 'AUDIT', 'MORATORIUM', 'SANCTIONS', 'LOCKDOWN', 'INJUNCTION', 'BAILOUT', 'SUMMIT'];
function getCfg(n) {
  if (n <= LEVELS.length) return LEVELS[n - 1];
  let sd = n * 9301 + 49297; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const hue = (n * 47) % 360, boss = n % 5 === 0, ice = boss || r() < .6;
  const zones = [1, 2, 3, 4].filter(() => r() < .7).map(p => { const a = 100 + r() * 260; return { p, x1: a, x2: a + 140 + r() * 100 }; });
  return {
    name: N1[r() * N1.length | 0] + ' ' + N2[r() * N2.length | 0], fire: true, drones: true, ice, zones, boss, lock: boss,
    tip: boss ? 'BOSS: fiat trains! Grab all 3 KEYS to unseal FREEDOM.' : 'Everything at once. It only gets faster!',
    pc: [`hsl(${hue},45%,32%)`, `hsl(${hue},70%,65%)`, `hsl(${hue},45%,18%)`], bg: [`hsl(${hue},45%,10%)`, `hsl(${hue},45%,4%)`],
  };
}

// ---------- state ----------
let state = 'title', level = 1, lives = 3, score = 0, hi = +(localStorage.getItem('cbc_hi') || 0);
let maxLvl = +(localStorage.getItem('cbc_max') || 1), banner = 0, drones = [], ice = [], dSpawn = 0;
let P, barrels, coins, key, particles, floaters, tick = 0, spawnT = 0, stateT = 0, govThrow = 0;
let combo = 0, boss = null, levelStats = null, clearSummary = null, isDaily = false;
let revivesUsed = 0, doubleClaimed = false;
// ---------- ads (stub) ----------
// Swap the two "watch ad" states below (reviveAd / clearAd) for a real SDK call
// (e.g. AdMob's Capacitor plugin) before shipping. adFree only hides the banner and
// the forced prompts never appear anywhere else in the loop; rewarded ads stay optional.
const Ads = { adFree: (() => { try { return localStorage.getItem('tbj_adfree') === '1'; } catch (e) { return false; } })() };
let pausedFromPlay = false;
let shopReturn = 'title';
const COMBO_TIERS = [[0, 1], [3, 1.25], [6, 1.5], [10, 2], [15, 2.5], [20, 3]];
function comboMult() { let m = 1; for (const [n, mm] of COMBO_TIERS) if (combo >= n) m = mm; return m; }
function award(base, x, y, color, tag = '') {
  const mult = comboMult(), pts = Math.round(base * mult);
  score += pts; combo++;
  if (levelStats) levelStats.comboBonus += pts - base;
  addFloat(x, y, (mult > 1 ? 'x' + mult + ' ' : '') + '+' + pts + (tag ? ' ' + tag : ''), color);
  return pts;
}
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dailySeed() { let h = 0; for (const c of todayStr()) h = (h * 31 + c.charCodeAt(0)) >>> 0; return (h % 400) + 6; }

const keys = {};
const norm = e => e.code === 'Space' ? ' ' : e.key;
function press(k) { if (!keys[k]) onPress(k); keys[k] = true; }
function release(k) { keys[k] = false; }
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  press(norm(e));
});
window.addEventListener('keyup', e => release(norm(e)));
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { for (const k in keys) keys[k] = false; });
window.focus();
// on-screen / touch / mouse controls
const btns = { L: 'ArrowLeft', R: 'ArrowRight', U: 'ArrowUp', D: 'ArrowDown', J: ' ' };

function resetPlayer() {

// ---------- update ----------

function update() {

// tallies the level-clear reward breakdown: crypto, hazards, boss, portal, and the skill bonuses

    comboBonus: levelStats.comboBonus, bossBonus: levelStats.bossBonus, portalBase, perfect, perfectBonus,
    keyMaster, keyBonus, speedBonus, milestone,
    total: levelStats.cryptoPts + levelStats.hazardPts + levelStats.bossBonus + portalBase + perfectBonus + keyBonus + speedBonus + milestone,
    fact: level % 3 === 0 ? FACTS[(Math.random() * FACTS.length) | 0] : null, // every 3rd level only

function drawRobotAt(x, y, o, k = 1) {
  const sk = (shopItem(equipped.robot) || {}).skin || { body: ['#dbe6f2', '#8ea5c0'], head: ['#f0f5fb', '#a9bbd0'], badge: '#f7931a', visor: '#39f5ff', limb: '#71839e', joint: '#2f3b4f' };
  const sw = Math.sin(o.anim) * 4, air = !o.ground && !o.climb;
  ctx.save();
  if (k !== 1) { ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-x, -y); }
  if (o.ground) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y + 1, 12, 3, 0, 0, 7); ctx.fill(); }
  if (o.inv > 0) {
    const a = .28 + .1 * Math.sin(tick * .2), g = ctx.createRadialGradient(x, y - 26, 6, x, y - 26, 40);
    g.addColorStop(0, `rgba(125,211,255,${a})`); g.addColorStop(1, 'rgba(125,211,255,0)');
    ctx.fillStyle = g; disc(x, y - 26, 40); ctx.fill();
    ctx.strokeStyle = 'rgba(140,220,255,.7)'; ctx.lineWidth = 1.5; disc(x, y - 26, 31 + Math.sin(tick * .2) * 1.5); ctx.stroke();
  }
  ctx.lineCap = 'round';
  const lf = o.climb ? sw * .6 : (air ? 0 : (o.moving ? sw : 0)), lift = air ? 4 : 0;
  for (const s of [-1, 1]) {
    const off = s * lf, fx = x + s * 4 + (o.climb ? 0 : off * .6), fy = y - 3 - (o.climb ? Math.max(0, off) : lift + Math.max(0, -off) * .6);
    ctx.strokeStyle = sk.limb; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + s * 4, y - 13); ctx.lineTo(fx, fy); ctx.stroke();
    rr(fx - 5, fy - 2, 10, 5, 2.5); ctx.fillStyle = sk.joint; ctx.fill();
  }
  const arm = o.climb ? sw : (o.ground && o.moving ? -sw * .6 : 0);
  ctx.strokeStyle = sk.limb; ctx.lineWidth = 5;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(x + s * 11, y - 29); ctx.lineTo(x + s * 14, air ? y - 24 : y - 17 + s * arm); ctx.stroke();
    ctx.fillStyle = sk.joint; disc(x + s * 14, air ? y - 24 : y - 17 + s * arm, 3); ctx.fill();
  }
  const bg = ctx.createLinearGradient(0, y - 34, 0, y - 11); bg.addColorStop(0, sk.body[0]); bg.addColorStop(1, sk.body[1]);
  rr(x - 10, y - 34, 20, 23, 7); ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.save(); glow(sk.badge, 8); disc(x, y - 23, 5.5); ctx.fillStyle = sk.badge; ctx.fill(); ctx.restore();
  txt('B', x, y - 20.3, 8, '#fff', 'center', 900);
  const hg = ctx.createLinearGradient(0, y - 50, 0, y - 32); hg.addColorStop(0, sk.head[0]); hg.addColorStop(1, sk.head[1]);
  rr(x - 11, y - 50, 22, 17, 7); ctx.fillStyle = hg; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke();
  rr(x - 8.5, y - 46.5, 17, 10, 5); ctx.fillStyle = '#0a1224'; ctx.fill();
  ctx.save(); glow(sk.visor, 8); ctx.fillStyle = sk.visor; const ex = o.face * 1.6;
  disc(x - 3.6 + ex, y - 41.5, 2.2); ctx.fill(); disc(x + 3.6 + ex, y - 41.5, 2.2); ctx.fill(); ctx.restore();
  ctx.strokeStyle = sk.limb; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 50); ctx.lineTo(x, y - 56); ctx.stroke();
  ctx.save(); glow('#ff5252', 10); ctx.fillStyle = '#ff5252'; disc(x, y - 57, 3 + Math.sin(tick * .15) * .4); ctx.fill(); ctx.restore();
  ctx.restore();
}

function wrapText(str, maxWidth, size, weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(test).width > maxWidth) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function card(x, y, w, h) {

  ctx.save(); glow('rgba(0,0,0,.6)', 40); rr(x, y, w, h, 26); ctx.fillStyle = 'rgba(14,20,44,.94)'; ctx.fill(); ctx.restore();
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(255,255,255,.03)');
  rr(x, y, w, h, 26); ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.stroke();
}
function gradText(s, x, y, size, c1, c2, glowCol) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center';
  const w = ctx.measureText(s).width || 200, g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.save(); glow(glowCol, 22); ctx.fillStyle = g; ctx.fillText(s, x, y); ctx.restore();
}

function drawShop() {
  card(40, 60, 560, 640);
  drawRobotAt(W / 2, 150 + Math.sin(tick * .06) * 4, { face: 1, anim: tick * .05, ground: false, climb: false, moving: false, inv: 0 }, 2.1);

  for (const cat of SHOP_CATS) txt(SHOP_LABELS[cat], W / 2, SHOP_ROWY[cat] - 24, 10.5, 'rgba(255,255,255,.55)', 'center', 700);
  for (const { it, x, y, r } of shopLayout()) {
    const own = isOwned(it), eq = equipped[it.cat] === it.id;
    ctx.save(); if (!own) ctx.globalAlpha = .55;
    shopSwatch(it, x, y, r);
    ctx.restore();
    if (eq) { ctx.strokeStyle = '#7dffb0'; ctx.lineWidth = 3; disc(x, y, r + 4); ctx.stroke(); }
    else if (!own) { ctx.fillStyle = 'rgba(4,7,18,.7)'; disc(x, y, r); ctx.fill(); }
    txt(eq ? '\u2713 ' + it.name : own ? it.name : it.price + '', x, y + r + 14, 9, eq ? '#7dffb0' : own ? 'rgba(255,255,255,.6)' : '#ffd34d', 'center', 700);
  }
  txt(isTouch ? 'Tap a skin to equip or unlock · tap elsewhere to go back' : 'Click a skin to equip or unlock · ENTER / ESC to go back', W / 2, 668, 10.5, 'rgba(255,255,255,.45)');
}
function shopSwatch(it, x, y, r) {
  if (it.cat === 'robot') {
    const g = ctx.createLinearGradient(x, y - r, x, y + r); g.addColorStop(0, it.skin.body[0]); g.addColorStop(1, it.skin.body[1]);
    disc(x, y, r); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = it.skin.badge; ctx.lineWidth = 2; disc(x, y, r - 3); ctx.stroke();
  } else if (it.cat === 'trail') {
    disc(x, y, r); ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fill();
    if (it.color) { ctx.save(); glow(it.color, 10); ctx.fillStyle = it.color; disc(x, y, 6); ctx.fill(); ctx.restore(); }
    else { ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.setLineDash([3, 3]); disc(x, y, r - 5); ctx.stroke(); ctx.setLineDash([]); }
  } else if (it.cat === 'boulder') {
    const rk = it.rock, g = ctx.createRadialGradient(x - 4, y - 5, 2, x, y, r); g.addColorStop(0, rk[0]); g.addColorStop(.55, rk[1]); g.addColorStop(1, rk[2]);
    disc(x, y, r); ctx.fillStyle = g; ctx.fill();
  } else if (it.cat === 'coin') {
    disc(x, y, r); ctx.fillStyle = '#f7931a'; ctx.fill(); txt('B', x, y + 5, 14, '#fff', 'center', 800);
    if (it.id === 'coin_neon') { ctx.strokeStyle = '#9be7ff'; ctx.lineWidth = 2; disc(x, y, r + 3); ctx.stroke(); }
  }
}

function clearLines(s) {
  const lines = [['Crypto', '+' + s.cryptoPts, '#ffd34d']];
  if (s.hazardPts) lines.push(['Hazards', '+' + s.hazardPts, '#9be7ff']);
  if (s.bossBonus) lines.push(['Boss', '+' + s.bossBonus, '#ff9a9a']);
  lines.push(['Portal', '+' + s.portalBase, '#7dffb0']);
  if (s.perfectBonus) lines.push(['Perfect level', '+' + s.perfectBonus, '#ffd34d']);
  if (s.keyBonus) lines.push(['Key master', '+' + s.keyBonus, '#9be7ff']);
  if (s.speedBonus) lines.push(['Speed', '+' + s.speedBonus, '#ff9a3c']);
  if (s.milestone) lines.push(['Milestone', '+' + s.milestone, '#ffb066']);
  if (s.doubled) lines.push(['2\u00D7 AD BONUS', '+' + (s.total / 2), '#ffd48c']);
  return lines;
}
function clearChoiceLayout(s) {
  const lines = clearLines(s), h = 96 + lines.length * 22 + 92, y = Math.max(36, 360 - h / 2);
  const totalY = y + 60 + lines.length * 22 + 8;
  return { y, h, lines, totalY, watchY: totalY + 42, continueY: totalY + 74 };
}

}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .9; if (shake < .5) shake = 0; }
  drawBg();
  ladders.forEach(drawLadder);
  plats.forEach(drawPlat); drawIce();
  drawGov(); drawExit();
  if (coins) coins.forEach(c => !c.got && drawCoin(c));
  if (key) drawKey();
  if (barrels) barrels.forEach(drawBarrel);
  drones.forEach(drawDrone);
  if (P && state !== 'title') drawRobot();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of particles || []) { ctx.globalAlpha = Math.max(0, p.life / 40); ctx.fillStyle = p.c; disc(p.x, p.y, 1.5 + p.life / 14); ctx.fill(); }
  ctx.restore();
  for (const f of floaters || []) {
    ctx.globalAlpha = Math.min(1, f.life / 18); ctx.font = `800 14px ${FONT}`; ctx.textAlign = 'center';
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(f.t, f.x, f.y); txt(f.t, f.x, f.y, 14, f.c, 'center', 800); ctx.globalAlpha = 1;
  }
  if (!vig) { vig = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .82); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,.38)'); }
  ctx.fillStyle = vig; ctx.fillRect(-20, -20, W + 40, H + 40);
  if (state !== 'title') drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'shop') drawShop();
  if (state === 'over') drawOver();
  if (state === 'reviveOffer') drawReviveOffer();
  if (state === 'reviveAd' || state === 'clearAd') drawAdPlaying();
  if (banner > 0 && state === 'play') drawBanner();
  if (state === 'clear') drawClear();
  if (state === 'clearChoice') drawClearChoice();
  if (state === 'paused') drawPaused();
}

function drawClear() {
  const s = clearSummary; if (!s) return;
  const lines = clearLines(s);
  const factLines = s.fact ? wrapText(s.fact, 400, 11) : [];
  const factH = factLines.length ? 34 + factLines.length * 15 : 0;
  const h = 96 + lines.length * 22 + factH, y = 360 - h / 2;

  lines.forEach(([label, val, c], i) => {

  const totalY = y + 60 + lines.length * 22;
  txt('TOTAL  ' + s.total, W / 2, totalY, 15, '#fff', 'center', 900);
  if (factLines.length) {
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1;

function drawClearChoice() {
  const s = clearSummary; if (!s) return;
  const { y, h, lines, watchY, continueY } = clearChoiceLayout(s);
  glass(80, y, W - 160, h, 22, 'rgba(8,24,20,.88)', 'rgba(125,255,176,.45)');
  txt('LEVEL ' + level + ' CLEARED', W / 2, y + 34, 22, '#7dffb0', 'center', 900);
  lines.forEach(([label, val, c], i) => {
    const ly = y + 60 + i * 22;
    txt(label, W / 2 - 120, ly, 12, 'rgba(255,255,255,.7)', 'left', 600);
    txt(val, W / 2 + 120, ly, 12, c, 'right', 800);
  });
  txt('TOTAL  ' + s.total, W / 2, watchY - 34, 15, '#fff', 'center', 900);
  pill('WATCH AD \u2192 CLAIM ' + (s.total * 2), W / 2, watchY, 340, 42, '#ffd48c', '#ff9a3c', .025);
  glass(W / 2 - 150, continueY - 15, 300, 30, 15, 'rgba(255,255,255,.06)');
  txt((isTouch ? 'TAP HERE TO' : 'ENTER \u00B7') + ' just claim ' + s.total, W / 2, continueY + 5, 10.5, 'rgba(255,255,255,.65)', 'center', 700);
}

// ---------- loop (fixed 60fps step) ----------
let last = performance.now(), acc = 0;
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(frame);
}
if (Ads.adFree) { const b = document.getElementById('adBanner'); if (b) b.classList.add('hidden'); }
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
