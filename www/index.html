<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bank Job</title>
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bank Job">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
    background:radial-gradient(120% 80% at 50% 0%,#141b3a 0%,#080b18 60%,#05070f 100%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  canvas{width:min(100vw, calc((100dvh - 150px) * 640 / 720));aspect-ratio:640/720;height:auto;display:block;background:#0b1020}
  @media (min-width:700px){canvas{border-radius:22px;box-shadow:0 0 0 1px #ffffff1a,0 20px 80px #000c,0 0 90px #ff7a5a1f}}
  #pad{width:100%;max-width:640px;height:140px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;touch-action:none}
  #pad .grp{display:flex;gap:12px;align-items:center}
  #pad .col{display:flex;flex-direction:column;gap:10px}
  #pad button{width:64px;height:64px;padding:0;border-radius:20px;color:#e8f2ff;font:600 22px system-ui,sans-serif;touch-action:none;
    background:linear-gradient(160deg,#ffffff24,#ffffff0a);border:1px solid #ffffff2e;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 18px #0007,inset 0 1px 0 #ffffff26;
    transition:transform .07s,background .07s,box-shadow .07s}
  #pad button.on,#pad button:active{transform:scale(.92);background:linear-gradient(160deg,#7dffb044,#7dffb01a);border-color:#7dffb088;box-shadow:0 2px 10px #0008,0 0 18px #7dffb044}
  #pad .j{width:104px;height:104px;border-radius:50%;border:none;color:#fff;font:800 17px system-ui,sans-serif;letter-spacing:.06em;
    background:linear-gradient(145deg,#ff9a3c,#ff4f7b);box-shadow:0 8px 26px #ff4f7b66,inset 0 2px 0 #ffffff55}
  #pad .j.on,#pad .j:active{background:linear-gradient(145deg,#ffb066,#ff6f95);box-shadow:0 2px 12px #ff4f7b88,0 0 30px #ff4f7b88}
  #adBanner{width:100%;max-width:640px;margin-top:8px;padding:7px 14px;border-radius:14px;text-align:center;
    background:linear-gradient(160deg,#ffffff14,#ffffff08);border:1px solid #ffffff22;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #adBanner .tag{font-size:8.5px;letter-spacing:.06em;color:#ff9a9a;text-transform:uppercase;margin-bottom:2px}
  #adBanner .msg{font-size:11px;font-weight:600;color:#e8f0ff}
  #adBanner.hidden{display:none}
  @media (orientation:landscape) and (max-height:520px){
    canvas{width:min(100vw, calc(100dvh * 640 / 720))}
    #pad{position:fixed;inset:0;max-width:none;height:auto;padding:0 max(18px,env(safe-area-inset-left)) 14px;align-items:flex-end;pointer-events:none}
    #pad button{pointer-events:auto;width:58px;height:58px}
    #pad .j{width:92px;height:92px}
    #adBanner{display:none}
  }
  @media (max-height:640px){ #adBanner{display:none} }
</style>
</head>
<body>
<canvas id="c" width="640" height="720"></canvas>
<div id="adBanner"><div class="tag">the government has placed an advertisement here</div><div class="msg">ADVERTISEMENT &middot; someone has to pay for all this freedom</div></div>
<div id="pad">
  <div class="grp"><button data-k="L">&#9664;</button><button data-k="R">&#9654;</button></div>
  <div class="col"><button data-k="U">&#9650;</button><button data-k="D">&#9660;</button></div>
  <button class="j" data-k="J">JUMP</button>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 640, H = 720, DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;

// ---------- audio ----------
let ac = null;
let muted = (() => { try { return localStorage.getItem('tbj_muted') === '1'; } catch (e) { return false; } })();
function toggleMute() { muted = !muted; try { localStorage.setItem('tbj_muted', muted ? '1' : '0'); } catch (e) {} }
function beep(f, d = .08, type = 'square', vol = .05, slide = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, ac.currentTime + d);
    g.gain.value = vol; g.gain.linearRampToValueAtTime(0, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
// a single filtered noise hit -- the building block for the drum sting below
function drumHit(t0, dur, freq, vol, q = 1.1) {
  const n = Math.max(1, ac.sampleRate * dur | 0), buf = ac.createBuffer(1, n, ac.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  const g = ac.createGain(); g.gain.value = vol; g.gain.linearRampToValueAtTime(0, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(t0); src.stop(t0 + dur);
}
// heist-briefing drum sting: tense low toms + a hi-hat run, in the spirit of a spy-movie
// cue -- an original rhythm, not the copyrighted Mission: Impossible theme melody.
function heistSting() {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    [0, .14, .28, .50, .64, .78].forEach((o, i) => drumHit(t + o, .12, i % 3 === 0 ? 105 : 150, .1));
    [0, .07, .14, .21, .28, .35, .50, .57, .64, .71, .78, .85].forEach(o => drumHit(t + o, .035, 5200, .028, 3));
  } catch (e) {}
}

// ---------- level geometry ----------
// each platform is a sloped girder; barrels roll downhill (yr > yl = roll right)
const plats = [
  { x1: 0,  x2: 640, yl: 690, yr: 680 },   // ground, rolls left
  { x1: 0,  x2: 580, yl: 580, yr: 600 },   // rolls right
  { x1: 60, x2: 640, yl: 500, yr: 480 },   // rolls left
  { x1: 0,  x2: 580, yl: 370, yr: 390 },   // rolls right
  { x1: 60, x2: 640, yl: 290, yr: 270 },   // rolls left
  { x1: 0,  x2: 400, yl: 150, yr: 160 },   // top: government lives here
];
const surf = (p, x) => p.yl + (p.yr - p.yl) * (x - p.x1) / (p.x2 - p.x1);
const inP = (p, x) => x >= p.x1 && x <= p.x2;

const ladderDefs = [[0, 1, 120], [1, 2, 520], [2, 3, 140], [3, 4, 500], [4, 5, 300]];
const ladders = ladderDefs.map(([lo, hi, x]) => ({ x, top: surf(plats[hi], x), bot: surf(plats[lo], x) }));

const coinSpots = [
  [0, 220], [0, 340], [0, 460], [1, 90], [1, 300], [1, 440], [2, 200], [2, 340], [2, 470],
  [3, 110], [3, 250], [3, 400], [4, 200], [4, 400], [4, 560], [5, 200],
];
const CRYPTO = [ // collectible coins
  { s: 'B', c: '#f7931a', r: '#ffd27a' },   // Bitcoin
  { s: '\u039E', c: '#5c6fd6', r: '#b4c0ff' }, // Ethereum
  { s: 'S', c: '#8a4df0', r: '#d0b0ff' },   // Solana
  { s: 'D', c: '#c9a227', r: '#ffe58a' },   // Dogecoin
];
const FIAT = [ // rolling hazards
  { l: 'USD', s: '$', c: '#2e9e50', r: '#8ff0a4' },
  { l: 'EUR', s: '\u20AC', c: '#2f6fd6', r: '#9cc4ff' },
  { l: 'ZAR', s: 'R', c: '#e08a12', r: '#ffd27a' },
];
const EXIT = { x: 340, w: 60 };
const GOV = { x: 12, w: 96 };
const LEVELS = [
  { name: 'LOCAL REGULATOR', tip: 'Fiat rolls downhill. Jump it!', pc: ['#1f8f6b', '#34d399', '#0d5a44'], bg: ['#0d1430', '#070a14'] },
  { name: 'CENTRAL BANK', tip: 'NEW: Inflation fireballs bounce!', fire: true, pc: ['#a8801a', '#f2c94c', '#6b4f0d'], bg: ['#241a0a', '#0f0a04'] },
  { name: 'TAX AGENCY', tip: 'NEW: IRS audit drones fly in. Watch the !', fire: true, drones: true, pc: ['#7a4fc4', '#b794f6', '#43267a'], bg: ['#1a1030', '#0a0714'] },
  { name: 'EXCHANGE BAN', tip: 'NEW: Frozen accounts - the floor is slippery!', fire: true, drones: true, ice: true, pc: ['#3b82c4', '#8fd0ff', '#1e4a7a'], bg: ['#0a1c30', '#050b14'] },
  { name: 'GLOBAL SUMMIT', tip: 'BOSS: Fiat trains! Grab all 3 KEYS to unseal FREEDOM.', fire: true, drones: true, ice: true, boss: true, lock: true, pc: ['#a83a3a', '#ff7b7b', '#5c1a1a'], bg: ['#2a0a12', '#10040a'] },
];
let cfg = LEVELS[0];
const N1 = ['SEC', 'IMF', 'FED', 'ECB', 'OFAC', 'FATF', 'BIS', 'CFTC', 'MICA', 'FinCEN'];
const N2 = ['CRACKDOWN', 'AUDIT', 'MORATORIUM', 'SANCTIONS', 'LOCKDOWN', 'INJUNCTION', 'BAILOUT', 'SUMMIT'];
function getCfg(n) {
  if (n <= LEVELS.length) return LEVELS[n - 1];
  let sd = n * 9301 + 49297; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const hue = (n * 47) % 360, boss = n % 5 === 0, ice = boss || r() < .6;
  const zones = [1, 2, 3, 4].filter(() => r() < .7).map(p => { const a = 100 + r() * 260; return { p, x1: a, x2: a + 140 + r() * 100 }; });
  return {
    name: N1[r() * N1.length | 0] + ' ' + N2[r() * N2.length | 0], fire: true, drones: true, ice, zones, boss, lock: boss,
    tip: boss ? 'BOSS: fiat trains! Grab all 3 KEYS to unseal FREEDOM.' : 'Everything at once. It only gets faster!',
    pc: [`hsl(${hue},45%,32%)`, `hsl(${hue},70%,65%)`, `hsl(${hue},45%,18%)`], bg: [`hsl(${hue},45%,10%)`, `hsl(${hue},45%,4%)`],
  };
}

// ---------- state ----------
let state = 'title', level = 1, lives = 3, score = 0, hi = +(localStorage.getItem('cbc_hi') || 0);
let maxLvl = +(localStorage.getItem('cbc_max') || 1), banner = 0, drones = [], ice = [], dSpawn = 0;
let P, barrels, coins, key, particles, floaters, tick = 0, spawnT = 0, stateT = 0, govThrow = 0;
let combo = 0, boss = null, levelStats = null, clearSummary = null, isDaily = false;
let revivesUsed = 0, doubleClaimed = false;
// ---------- ads (stub) ----------
// Swap the two "watch ad" states below (reviveAd / clearAd) for a real SDK call
// (e.g. AdMob's Capacitor plugin) before shipping. adFree only hides the banner and
// the forced prompts never appear anywhere else in the loop; rewarded ads stay optional.
const Ads = { adFree: (() => { try { return localStorage.getItem('tbj_adfree') === '1'; } catch (e) { return false; } })() };
let pausedFromPlay = false;
const COMBO_TIERS = [[0, 1], [3, 1.25], [6, 1.5], [10, 2], [15, 2.5], [20, 3]];
function comboMult() { let m = 1; for (const [n, mm] of COMBO_TIERS) if (combo >= n) m = mm; return m; }
function award(base, x, y, color, tag = '') {
  const mult = comboMult(), pts = Math.round(base * mult);
  score += pts; combo++;
  if (levelStats) levelStats.comboBonus += pts - base;
  addFloat(x, y, (mult > 1 ? 'x' + mult + ' ' : '') + '+' + pts + (tag ? ' ' + tag : ''), color);
  return pts;
}
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dailySeed() { let h = 0; for (const c of todayStr()) h = (h * 31 + c.charCodeAt(0)) >>> 0; return (h % 400) + 6; }

const keys = {};
const norm = e => e.code === 'Space' ? ' ' : e.key;
function press(k) { if (!keys[k]) onPress(k); keys[k] = true; }
function release(k) { keys[k] = false; }
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  press(norm(e));
});
window.addEventListener('keyup', e => release(norm(e)));
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { for (const k in keys) keys[k] = false; });
window.focus();
// on-screen / touch / mouse controls
const btns = { L: 'ArrowLeft', R: 'ArrowRight', U: 'ArrowUp', D: 'ArrowDown', J: ' ' };
document.querySelectorAll('#pad button').forEach(b => {
  const k = btns[b.dataset.k];
  const dn = e => { e.preventDefault(); window.focus(); b.classList.add('on'); press(k); };
  const up = e => { e.preventDefault(); b.classList.remove('on'); release(k); };
  b.addEventListener('pointerdown', dn); b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});
addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  window.focus();
  const r = cv.getBoundingClientRect(), cx = (e.clientX - r.left) * W / r.width, cy = (e.clientY - r.top) * H / r.height;
  if (state === 'play') { if (Math.hypot(cx - (W - 30), cy - 21) < 22) onPress('p'); return; }
  if (state === 'paused') {
    if (cx > W / 2 - 130 && cx < W / 2 + 130 && cy > 424 && cy < 458) { onPress('m'); return; }
    onPress('p'); return;
  }
  if (state === 'reviveOffer') { onPress(cy < 450 ? 'w' : 'Enter'); return; }
  if (state === 'clearChoice' && clearSummary) {
    const lo = clearChoiceLayout(clearSummary);
    onPress(cy < (lo.watchY + lo.continueY) / 2 ? 'w' : 'Enter'); return;
  }
  if (state !== 'title' && state !== 'over') return;
  if (state !== 'title') { onPress('Enter'); return; }
  let rowY = 594;
  if (maxLvl > 1) { if (cy > rowY - 4 && cy < rowY + 34) { onPress('c'); return; } rowY += 36; }
  if (cy > rowY - 4 && cy < rowY + 34) { onPress('t'); return; }
  onPress('Enter');
});
const L = () => keys.ArrowLeft || keys.a || keys.A;
const R = () => keys.ArrowRight || keys.d || keys.D;
const U = () => keys.ArrowUp || keys.w || keys.W;
const D = () => keys.ArrowDown || keys.s || keys.S;

function onPress(k) {
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if ((k === 'p' || k === 'P' || k === 'Escape') && (state === 'play' || state === 'paused')) {
    state = state === 'play' ? 'paused' : 'play'; return;
  }
  if (state === 'title' || state === 'over') {
    if ((k === 'c' || k === 'C') && state === 'title' && maxLvl > 1) { level = maxLvl; lives = 3; score = 0; isDaily = false; revivesUsed = 0; startLevel(); return; }
    if (/^[1-9]$/.test(k) && +k <= maxLvl && state === 'title') { level = +k; lives = 3; score = 0; isDaily = false; revivesUsed = 0; startLevel(); return; }
    if ((k === 't' || k === 'T') && state === 'title') { isDaily = true; level = 1; lives = 3; score = 0; revivesUsed = 0; startLevel(); return; }
    if (k === 'Enter' || k === ' ') { isDaily = false; level = 1; lives = 3; score = 0; revivesUsed = 0; startLevel(); }
    return;
  }
  if (state === 'reviveOffer') {
    if (k === 'w' || k === 'W') { state = 'reviveAd'; stateT = 90; return; }
    if (k === 'Enter' || k === ' ') endGame();
    return;
  }
  if (state === 'clearChoice') {
    if (k === 'w' || k === 'W') { state = 'clearAd'; stateT = 90; return; }
    if (k === 'Enter' || k === ' ') { doubleClaimed = false; finishClear(); }
    return;
  }
  if (state === 'play' && (k === ' ' || k === 'z' || k === 'Z') && P.ground && !P.climb) {
    P.vy = -9.2; P.ground = false; buzz(12); beep(330, .15, 'square', .05, 300);
  }
}

function startLevel() {
  coins = coinSpots.map(([pi, x]) => ({ x, y: surf(plats[pi], x) - 26, got: false, ph: Math.random() * 6, cur: CRYPTO[Math.random() * CRYPTO.length | 0] }));
  cfg = getCfg(isDaily ? dailySeed() + level - 1 : level);
  const ks = cfg.lock ? [[596, 2], [60, 3], [560, 4]] : [[596, 2]];
  key = ks.map(([x, pi]) => ({ x, y: surf(plats[pi], x) - 24, got: false }));
  ice = cfg.ice ? (cfg.zones || [{ p: 1, x1: 200, x2: 380 }, { p: 3, x1: 240, x2: 420 }, { p: 4, x1: 300, x2: 500 }]) : [];
  drones = []; dSpawn = 200; banner = 170; heistSting();
  boss = cfg.boss ? { hp: 3, maxHp: 3, dead: false, cool: 0 } : null;
  combo = 0;
  levelStats = { coinsTotal: coins.length, coinsGot: 0, keysTotal: key.length, keysGot: 0, cryptoPts: 0, hazardPts: 0, comboBonus: 0, bossBonus: 0, hitTaken: false, startTick: tick };
  if (!isDaily && level > maxLvl) { maxLvl = level; try { localStorage.setItem('cbc_max', maxLvl); } catch (e) {} }
  barrels = []; particles = []; floaters = [];
  spawnT = 95; resetPlayer(); state = 'play';
}
function resetPlayer() {
  P = { x: 40, y: surf(plats[0], 40), vx: 0, vy: 0, ground: true, climb: null, face: 1, anim: 0, inv: 0 };
  barrels = barrels.filter(b => b.y < 100); // clear near-player mess but keep it fair
  barrels = [];
}

function addFloat(x, y, t, c = '#ffd34d') { floaters.push({ x, y, t, c, life: 45 }); }
function burst(x, y, c, n = 10) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 5, life: 30 + Math.random() * 15, c });
}

// ---------- update ----------
function spawnBarrel(fire, off = 0) {
  const p = plats[5], x = GOV.x + GOV.w + 10 - off;
  barrels.push({ x, y: surf(p, x), vy: fire ? -4 : 0, dir: 1, fall: !!fire, fire: !!fire, p: 5,
                 label: fire ? 'INFL' : '', fiat: FIAT[Math.random() * FIAT.length | 0], rot: 0, scored: false });
  govThrow = 18; beep(120, .12, 'sawtooth', .04);
}

const onIce = (x, y) => ice.some(z => x >= z.x1 && x <= z.x2 && Math.abs(y - surf(plats[z.p], x)) < 10);
function landing(x, py, y) {
  for (let i = plats.length - 1; i >= 0; i--) {
    const p = plats[i];
    if (!inP(p, x)) continue;
    const s = surf(p, x);
    if (py <= s + 3 && y >= s) return { y: s, i };
  }
  return null;
}

function update() {
  if (state === 'paused') return;
  tick++;
  if (govThrow > 0) govThrow--;
  if (state === 'dying') {
    stateT--; updateFx();
    if (stateT <= 0) {
      lives--;
      if (lives > 0) { resetPlayer(); state = 'play'; }
      else if (!Ads.adFree && revivesUsed < 1) { state = 'reviveOffer'; }
      else endGame();
    }
    return;
  }
  if (state === 'reviveOffer') { updateFx(); return; }
  if (state === 'reviveAd') {
    stateT--; updateFx();
    if (stateT <= 0) { revivesUsed++; lives = 1; combo = 0; resetPlayer(); state = 'play'; }
    return;
  }
  if (state === 'clearChoice') { updateFx(); return; }
  if (state === 'clearAd') {
    stateT--; updateFx();
    if (stateT <= 0) { doubleClaimed = true; finishClear(); }
    return;
  }
  if (state === 'clear') { stateT--; updateFx(); if (stateT <= 0) { level++; startLevel(); } return; }
  if (state !== 'play') return;

  // player
  const speed = 2.8;
  if (P.inv > 0) P.inv--;
  if (P.climb) {
    const l = P.climb;
    if (U()) P.y -= 2.4; else if (D()) P.y += 2.4;
    if (U() || D()) P.anim += .3;
    if (P.y <= l.top) { P.y = l.top; P.climb = null; P.ground = true; }
    else if (P.y >= l.bot) { P.y = l.bot; P.climb = null; P.ground = true; }
  } else {
    const tv = (R() ? speed : 0) - (L() ? speed : 0);
    P.vx = P.ground && onIce(P.x, P.y) ? P.vx + (tv - P.vx) * .04 : tv;
    if (Math.abs(P.vx) > .3) { P.face = Math.sign(P.vx); P.anim += .28; }
    P.x = Math.max(12, Math.min(W - 12, P.x + P.vx));

    // grab ladder
    for (const l of ladders) {
      if (Math.abs(P.x - l.x) > 16) continue;
      if ((U() && P.y <= l.bot + 2 && P.y > l.top + 2) || (D() && P.y >= l.top - 2 && P.y < l.bot - 2)) {
        P.climb = l; P.x = l.x; P.vy = 0; P.ground = false; break;
      }
    }
    if (!P.climb) {
      if (P.ground) {
        const p = plats.find(p => inP(p, P.x) && Math.abs(P.y - surf(p, P.x)) <= 8);
        if (p) P.y = surf(p, P.x); else P.ground = false;
      } else {
        const py = P.y; P.vy += .5; P.y += P.vy;
        if (P.vy >= 0) { const h = landing(P.x, py, P.y); if (h) { P.y = h.y; P.vy = 0; P.ground = true; } }
        if (P.y > 720) { P.y = surf(plats[0], P.x); P.vy = 0; P.ground = true; }
      }
    }
  }

  // exit
  if (P.y < 200 && P.x > EXIT.x && P.x < EXIT.x + EXIT.w && (!cfg.lock || key.every(k => k.got)) && (!cfg.boss || (boss && boss.dead))) {
    enterClear();
    return;
  }

  // coins & key
  for (const c of coins) if (!c.got && Math.abs(c.x - P.x) < 16 && Math.abs(c.y - (P.y - 18)) < 24) {
    c.got = true; levelStats.coinsGot++;
    levelStats.cryptoPts += award(100, c.x, c.y - 10, '#ffd34d');
    burst(c.x, c.y, c.cur.c, 8); beep(988, .06, 'square', .05); setTimeout(() => beep(1318, .1), 55);
  }
  for (const k of key) if (!k.got && Math.abs(k.x - P.x) < 18 && Math.abs(k.y - (P.y - 18)) < 26) {
    k.got = true; P.inv = 60 * (cfg.lock ? 5 : 7); levelStats.keysGot++; combo++;
    addFloat(P.x, P.y - 50, cfg.lock ? 'KEY ' + key.filter(q => q.got).length + '/' + key.length : 'SELF-CUSTODY!', '#7dd3ff'); beep(520, .3, 'triangle', .07, 500);
  }

  // barrels
  if (!(boss && boss.dead) && --spawnT <= 0) {
    const fire = cfg.fire && Math.random() < .4, n = cfg.boss && !fire && Math.random() < .45 ? 3 : 1;
    for (let i = 0; i < n; i++) spawnBarrel(fire, i * 30);
    spawnT = Math.max(52, 175 - level * 10) * (n > 1 ? 1.5 : 1) + Math.random() * 40;
  }
  if (cfg.drones && !(boss && boss.dead) && --dSpawn <= 0) {

    drones.push({ pi, x: left ? -20 : 660, dir: left ? 1 : -1, warn: 55, y: 0 });
    dSpawn = Math.max(100, 320 - level * 12) + Math.random() * 90;
  }
  if (banner > 0) banner--;
  // boss fight: touch the government while shielded to damage it
  if (boss && !boss.dead) {
    if (boss.cool > 0) boss.cool--;
    const bx = GOV.x + GOV.w / 2;
    if (P.inv > 0 && boss.cool <= 0 && P.ground && Math.abs(P.y - surf(plats[5], P.x)) < 10 && Math.abs(P.x - bx) < 46) {
      boss.hp--; boss.cool = 50; shake = 10; buzz(25);
      burst(bx, surf(plats[5], bx) - 60, '#ff5252', 12); beep(150, .12, 'sawtooth', .05, -80);
      if (boss.hp <= 0) {
        boss.dead = true; levelStats.bossBonus = 1000; score += 1000; combo = 0;
        addFloat(bx, surf(plats[5], bx) - 90, 'BOSS DEFEATED +1000', '#ffd34d');
        burst(bx, surf(plats[5], bx) - 70, '#ffd34d', 26); shake = 20;
        beep(220, .15); setTimeout(() => beep(330, .15), 100); setTimeout(() => beep(440, .25), 200);
      } else {
        addFloat(bx, surf(plats[5], bx) - 90, 'BOSS ' + boss.hp + '/' + boss.maxHp, '#ff8a8a');
      }
    }
  }
  const bs = Math.min(3.6, 1.3 + level * .15);
  for (const b of barrels) {
    b.rot += b.dir * .12;
    if (!b.fall) {
      const p = plats[b.p];
      b.x += b.dir * bs;
      if (!inP(p, b.x)) { b.fall = true; b.vy = 0; } else b.y = surf(p, b.x);
    } else {
      const py = b.y; b.vy += .45; b.y += b.vy; b.x += b.dir * (b.fire ? bs * 1.1 : .8);
      const h = landing(b.x, py, b.y);

    // hop bonus

      b.scored = true; levelStats.hazardPts += award(50, P.x, P.y - 40, '#9be7ff', 'JUMP'); beep(760, .05, 'triangle', .05);
    }
    // collision
    if (Math.abs(b.x - P.x) < 15 && Math.abs((b.y - 12) - (P.y - 22)) < 20) {
      if (P.inv > 0) { b.dead = true; levelStats.hazardPts += award(200, b.x, b.y - 20, '#7dd3ff', 'DECENTRALIZED'); burst(b.x, b.y - 12, '#7dd3ff', 14); beep(200, .15, 'sawtooth', .06, -100); }

  barrels = barrels.filter(b => !b.dead);
  for (const d of drones) {
    if (d.warn > 0) { d.warn--; continue; }
    d.x += d.dir * Math.min(4.2, 2.2 + level * .08);
    const p = plats[d.pi];
    d.y = surf(p, Math.max(p.x1, Math.min(p.x2, d.x))) - 30 + Math.sin(tick * .15) * 4;
    if (Math.abs(d.x - P.x) < 18 && Math.abs(d.y - (P.y - 24)) < 20) {

}

function updateFx() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += .3; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= .6; f.life--; }
  floaters = floaters.filter(f => f.life > 0);
}

const buzz = ms => { if (muted) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function die() {
  buzz([60, 40, 120]); shake = 16; combo = 0;
  if (levelStats) levelStats.hitTaken = true;
  state = 'dying'; stateT = 90; burst(P.x, P.y - 20, '#9fb4c7', 22); burst(P.x, P.y - 20, '#ff9800', 10);
  beep(400, .5, 'sawtooth', .07, -350);
}
function endGame() {
  state = 'over';
  if (isDaily) {
    const dk = 'tbj_daily_' + todayStr(), dHi = +(localStorage.getItem(dk) || 0);
    if (score > dHi) { try { localStorage.setItem(dk, score); } catch (e) {} }
  } else if (score > hi) { hi = score; try { localStorage.setItem('cbc_hi', hi); } catch (e) {} }
}

// tallies the level-clear reward breakdown: crypto, hazards, boss, portal, and the skill bonuses
function enterClear() {
  const coinsGot = coins.filter(c => c.got).length, portalBase = 500 + coinsGot * 20;
  const perfect = levelStats.coinsTotal > 0 && coinsGot === levelStats.coinsTotal && !levelStats.hitTaken;
  const keyMaster = levelStats.keysTotal > 0 && levelStats.keysGot === levelStats.keysTotal;
  const elapsed = (tick - levelStats.startTick) / 60;
  const speedBonus = Math.round(Math.max(0, Math.min(1, (60 - elapsed) / 45)) * 250);
  const milestone = level % 10 === 0 ? 2500 : 0;
  const perfectBonus = perfect ? 500 : 0, keyBonus = keyMaster ? 300 : 0;
  score += portalBase + perfectBonus + keyBonus + speedBonus + milestone;
  clearSummary = {
    coinsGot, coinsTotal: levelStats.coinsTotal, cryptoPts: levelStats.cryptoPts, hazardPts: levelStats.hazardPts,
    comboBonus: levelStats.comboBonus, bossBonus: levelStats.bossBonus, portalBase, perfect, perfectBonus,
    keyMaster, keyBonus, speedBonus, milestone,
    total: levelStats.cryptoPts + levelStats.hazardPts + levelStats.bossBonus + portalBase + perfectBonus + keyBonus + speedBonus + milestone,
  };
  addFloat(P.x, P.y - 60, 'FREEDOM +' + portalBase, '#7dffb0');
  beep(660, .12); setTimeout(() => beep(880, .2), 120); setTimeout(() => beep(1180, .3), 260);
  doubleClaimed = false; state = 'clearChoice'; stateT = 240;
  barrels.forEach(b => burst(b.x, b.y - 10, '#8aa0b8', 6)); barrels = []; drones = [];
}

// applies the 2x-ad bonus (if chosen) and moves on to the plain level-clear summary
function finishClear() {
  if (doubleClaimed && clearSummary && !clearSummary.doubled) {
    score += clearSummary.total; clearSummary.doubled = true; clearSummary.total *= 2;
  }
  state = 'clear'; stateT = 170;
}

function buildBg() {

  let sd = level * 7919 + 13; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (const [alpha, minH, maxH] of [[.05, 80, 300], [.09, 50, 200]]) {

function drawDrone(d) {

    const x = d.dir > 0 ? 22 : W - 22, y = surf(p, Math.max(p.x1, Math.min(p.x2, x))) - 30;
    ctx.strokeStyle = 'rgba(255,82,82,.25)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
    if ((tick >> 2) & 1) { ctx.save(); glow('#ff5252', 16); disc(x, y, 13); ctx.fillStyle = '#ff5252'; ctx.fill(); ctx.restore(); txt('!', x, y + 6, 17, '#fff', 'center', 900); }
    return;
  }
  const x = d.x, y = d.y, g = ctx.createLinearGradient(0, y - 9, 0, y + 9); g.addColorStop(0, '#f4f7fc'); g.addColorStop(1, '#aab6cb');
  ctx.save(); glow('rgba(255,82,82,.55)', 12);

  ctx.strokeStyle = 'rgba(200,215,235,.85)'; ctx.lineWidth = 2; ctx.lineCap = 'round'; const r = 15 * Math.abs(Math.cos(tick * 1.3)) + 3;
  ctx.beginPath(); ctx.moveTo(x - r, y - 12); ctx.lineTo(x + r, y - 12); ctx.moveTo(x, y - 9); ctx.lineTo(x, y - 12); ctx.stroke();
  glass(x - 13, y + 11, 26, 13, 6.5, 'rgba(255,90,90,.16)', 'rgba(255,120,120,.5)'); txt('IRS', x, y + 21, 8, '#ff9a9a');

function drawBarrel(b) {
  const cy = b.y - 13;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(b.x, b.y + 1, 12, 3, 0, 0, 7); ctx.fill();

    ctx.beginPath(); ctx.moveTo(b.x + tx * 6, cy - 9); ctx.quadraticCurveTo(b.x + tx * 22, cy - 22, b.x + tx * 26, cy - 4);
    ctx.quadraticCurveTo(b.x + tx * 14, cy + 2, b.x + tx * 6, cy + 9); ctx.fill();

    const g = ctx.createRadialGradient(b.x, cy, 1, b.x, cy, 10); g.addColorStop(0, '#fffbe0'); g.addColorStop(1, '#ffc107');
    disc(b.x, cy, 8); ctx.fillStyle = g; ctx.fill();

  }

  ctx.beginPath(); ctx.moveTo(-9, -3); ctx.lineTo(-2, 2); ctx.lineTo(3, -4); ctx.moveTo(2, 3); ctx.lineTo(8, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.08)'; disc(-4, -6, 3); ctx.fill(); disc(6, 4, 2); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = f.r; ctx.lineWidth = 1.5; disc(b.x, cy, 7); ctx.stroke();

}

// ----- robot -----
function drawRobotAt(x, y, o, k = 1) {
  const sw = Math.sin(o.anim) * 4, air = !o.ground && !o.climb;
  ctx.save();
  if (k !== 1) { ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-x, -y); }
  if (o.ground) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y + 1, 12, 3, 0, 0, 7); ctx.fill(); }
  if (o.inv > 0) {
    const a = .28 + .1 * Math.sin(tick * .2), g = ctx.createRadialGradient(x, y - 26, 6, x, y - 26, 40);
    g.addColorStop(0, `rgba(125,211,255,${a})`); g.addColorStop(1, 'rgba(125,211,255,0)');
    ctx.fillStyle = g; disc(x, y - 26, 40); ctx.fill();
    ctx.strokeStyle = 'rgba(140,220,255,.7)'; ctx.lineWidth = 1.5; disc(x, y - 26, 31 + Math.sin(tick * .2) * 1.5); ctx.stroke();
  }
  ctx.lineCap = 'round';
  const lf = o.climb ? sw * .6 : (air ? 0 : (o.moving ? sw : 0)), lift = air ? 4 : 0;
  for (const s of [-1, 1]) {
    const off = s * lf, fx = x + s * 4 + (o.climb ? 0 : off * .6), fy = y - 3 - (o.climb ? Math.max(0, off) : lift + Math.max(0, -off) * .6);
    ctx.strokeStyle = '#71839e'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + s * 4, y - 13); ctx.lineTo(fx, fy); ctx.stroke();
    rr(fx - 5, fy - 2, 10, 5, 2.5); ctx.fillStyle = '#2f3b4f'; ctx.fill();
  }
  const arm = o.climb ? sw : (o.ground && o.moving ? -sw * .6 : 0);
  ctx.strokeStyle = '#71839e'; ctx.lineWidth = 5;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(x + s * 11, y - 29); ctx.lineTo(x + s * 14, air ? y - 24 : y - 17 + s * arm); ctx.stroke();
    ctx.fillStyle = '#2f3b4f'; disc(x + s * 14, air ? y - 24 : y - 17 + s * arm, 3); ctx.fill();
  }
  const bg = ctx.createLinearGradient(0, y - 34, 0, y - 11); bg.addColorStop(0, '#dbe6f2'); bg.addColorStop(1, '#8ea5c0');
  rr(x - 10, y - 34, 20, 23, 7); ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.save(); glow('#f7931a', 8); disc(x, y - 23, 5.5); ctx.fillStyle = '#f7931a'; ctx.fill(); ctx.restore();
  txt('B', x, y - 20.3, 8, '#fff', 'center', 900);
  const hg = ctx.createLinearGradient(0, y - 50, 0, y - 32); hg.addColorStop(0, '#f0f5fb'); hg.addColorStop(1, '#a9bbd0');
  rr(x - 11, y - 50, 22, 17, 7); ctx.fillStyle = hg; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke();
  rr(x - 8.5, y - 46.5, 17, 10, 5); ctx.fillStyle = '#0a1224'; ctx.fill();
  ctx.save(); glow('#39f5ff', 8); ctx.fillStyle = '#39f5ff'; const ex = o.face * 1.6;
  disc(x - 3.6 + ex, y - 41.5, 2.2); ctx.fill(); disc(x + 3.6 + ex, y - 41.5, 2.2); ctx.fill(); ctx.restore();
  ctx.strokeStyle = '#71839e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 50); ctx.lineTo(x, y - 56); ctx.stroke();
  ctx.save(); glow('#ff5252', 10); ctx.fillStyle = '#ff5252'; disc(x, y - 57, 3 + Math.sin(tick * .15) * .4); ctx.fill(); ctx.restore();
  ctx.restore();
}
function drawRobot() {
  if (state === 'dying') return;
  if (P.inv > 0 && P.inv < 120 && (tick >> 2) & 1) return;
  drawRobotAt(P.x, P.y, { face: P.face, anim: P.anim, ground: P.ground, climb: !!P.climb, moving: Math.abs(P.vx) > .3 || !!P.climb, inv: P.inv });
}

}
function gradText(s, x, y, size, c1, c2, glowCol) {

}

function clearLines(s) {
  const lines = [['Crypto', '+' + s.cryptoPts, '#ffd34d']];
  if (s.hazardPts) lines.push(['Hazards', '+' + s.hazardPts, '#9be7ff']);
  if (s.bossBonus) lines.push(['Boss', '+' + s.bossBonus, '#ff9a9a']);
  lines.push(['Portal', '+' + s.portalBase, '#7dffb0']);
  if (s.perfectBonus) lines.push(['Perfect level', '+' + s.perfectBonus, '#ffd34d']);
  if (s.keyBonus) lines.push(['Key master', '+' + s.keyBonus, '#9be7ff']);
  if (s.speedBonus) lines.push(['Speed', '+' + s.speedBonus, '#ff9a3c']);
  if (s.milestone) lines.push(['Milestone', '+' + s.milestone, '#ffb066']);
  if (s.doubled) lines.push(['2\u00D7 AD BONUS', '+' + (s.total / 2), '#ffd48c']);
  return lines;
}
function clearChoiceLayout(s) {
  const lines = clearLines(s), h = 96 + lines.length * 22 + 92, y = Math.max(36, 360 - h / 2);
  const totalY = y + 60 + lines.length * 22 + 8;
  return { y, h, lines, totalY, watchY: totalY + 42, continueY: totalY + 74 };
}
function drawBanner() {
  const a = Math.min(1, banner / 30) * Math.min(1, (170 - banner) / 12 + .2);

  rr(40, 300, 6, 84, 3); ctx.fillStyle = cfg.pc[1]; ctx.fill();

  txt(cfg.tip, 66, 374, 12, 'rgba(255,255,255,.65)', 'left', 500); ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .9; if (shake < .5) shake = 0; }
  drawBg();
  ladders.forEach(drawLadder);
  plats.forEach(drawPlat); drawIce();
  drawGov(); drawExit();
  if (coins) coins.forEach(c => !c.got && drawCoin(c));
  if (key) drawKey();
  if (barrels) barrels.forEach(drawBarrel);
  drones.forEach(drawDrone);
  if (P && state !== 'title') drawRobot();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of particles || []) { ctx.globalAlpha = Math.max(0, p.life / 40); ctx.fillStyle = p.c; disc(p.x, p.y, 1.5 + p.life / 14); ctx.fill(); }
  ctx.restore();
  for (const f of floaters || []) {
    ctx.globalAlpha = Math.min(1, f.life / 18); ctx.font = `800 14px ${FONT}`; ctx.textAlign = 'center';
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(f.t, f.x, f.y); txt(f.t, f.x, f.y, 14, f.c, 'center', 800); ctx.globalAlpha = 1;
  }
  if (!vig) { vig = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .82); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,.38)'); }
  ctx.fillStyle = vig; ctx.fillRect(-20, -20, W + 40, H + 40);
  if (state !== 'title') drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (state === 'reviveOffer') drawReviveOffer();
  if (state === 'reviveAd' || state === 'clearAd') drawAdPlaying();
  if (banner > 0 && state === 'play') drawBanner();
  if (state === 'clear') drawClear();
  if (state === 'clearChoice') drawClearChoice();
  if (state === 'paused') drawPaused();
}

function drawClear() {
  const s = clearSummary; if (!s) return;
  const lines = clearLines(s), h = 96 + lines.length * 22, y = 360 - h / 2;

  txt('LEVEL ' + level + ' CLEARED', W / 2, y + 34, 24, '#7dffb0', 'center', 900);
  lines.forEach(([label, val, c], i) => {
    const ly = y + 60 + i * 22;
    txt(label, W / 2 - 120, ly, 12, 'rgba(255,255,255,.7)', 'left', 600);
    txt(val, W / 2 + 120, ly, 12, c, 'right', 800);
  });
  txt('TOTAL  ' + s.total, W / 2, y + h - 14, 15, '#fff', 'center', 900);

function drawClearChoice() {
  const s = clearSummary; if (!s) return;
  const { y, h, lines, watchY, continueY } = clearChoiceLayout(s);
  glass(80, y, W - 160, h, 22, 'rgba(8,24,20,.88)', 'rgba(125,255,176,.45)');
  txt('LEVEL ' + level + ' CLEARED', W / 2, y + 34, 22, '#7dffb0', 'center', 900);
  lines.forEach(([label, val, c], i) => {
    const ly = y + 60 + i * 22;
    txt(label, W / 2 - 120, ly, 12, 'rgba(255,255,255,.7)', 'left', 600);
    txt(val, W / 2 + 120, ly, 12, c, 'right', 800);
  });
  txt('TOTAL  ' + s.total, W / 2, watchY - 34, 15, '#fff', 'center', 900);
  pill('WATCH AD \u2192 CLAIM ' + (s.total * 2), W / 2, watchY, 340, 42, '#ffd48c', '#ff9a3c', .025);
  glass(W / 2 - 150, continueY - 15, 300, 30, 15, 'rgba(255,255,255,.06)');
  txt((isTouch ? 'TAP HERE TO' : 'ENTER \u00B7') + ' just claim ' + s.total, W / 2, continueY + 5, 10.5, 'rgba(255,255,255,.65)', 'center', 700);
}

// ---------- loop (fixed 60fps step) ----------
let last = performance.now(), acc = 0;
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(frame);
}
if (Ads.adFree) { const b = document.getElementById('adBanner'); if (b) b.classList.add('hidden'); }
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
