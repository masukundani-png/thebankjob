name: Deploy web version

# Publishes the www/ folder as a playable website on GitHub Pages, on every push to main.
# One-time setup (repo owner): Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until that is switched on, this workflow fails at the deploy step; after enabling it, re-run it from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
