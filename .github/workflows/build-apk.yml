name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate the Android project
        run: npx cap add android

      - name: Generate launcher icons and splash screens
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d1430' --iconBackgroundColorDark '#0d1430' --splashBackgroundColor '#07090f' --splashBackgroundColorDark '#07090f'

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-bank-job-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
